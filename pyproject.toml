[build-system]
# setuptools has no dependencies (hatchling pulls pathspec, which is MPL-2.0; see docs/dependencies.md)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ad2v"
version = "0.2.0"
description = "agent development to viz: compare a repository against its SDD specs and emit one .ad2v SQLite file"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ad2v contributors" }]
dependencies = [
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-python==0.25.0",
    "gherkin-official>=42.0.1,<43",
    "pyyaml>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
ad2v = "ad2v.cli:main"

[tool.setuptools]
# schema/ is the canonical location; it ships inside the wheel as the data package ad2v._schema
packages = ["ad2v", "ad2v.extract", "ad2v.extract.code", "ad2v.extract.spec", "ad2v._schema"]

[tool.setuptools.package-dir]
"" = "src"
"ad2v._schema" = "schema"

[tool.setuptools.package-data]
"ad2v.extract.code" = ["rules/*.yaml"]
"ad2v._schema" = ["*.sql", "*.json", "themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fixtures", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/ad2v/preview.py" = ["E501"]  # HTML/CSS template text

[tool.ruff.lint.isort]
known-first-party = ["ad2v"]
known-local-folder = ["helpers"]
