[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ad2v"
version = "0.1.0"
description = "agent development to viz: compare a repository against its SDD specs and emit one .ad2v SQLite file"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ad2v contributors" }]
dependencies = [
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-python==0.25.0",
    "gherkin-official>=42.0.1,<43",
    "pyyaml>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
ad2v = "ad2v.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ad2v"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "ad2v/_schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fixtures", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["ad2v"]
known-local-folder = ["helpers"]
