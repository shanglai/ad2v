[build-system]
# setuptools has no dependencies (hatchling pulls pathspec, which is MPL-2.0; see docs/dependencies.md)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ad2v"
version = "0.7.0.dev0"
description = "agent development to viz: compare a repository against its SDD specs and emit one .ad2v SQLite file"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ad2v contributors" }]
dependencies = [
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-python==0.25.0",
    "gherkin-official>=42.0.1,<43",
    "pyyaml>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
ad2v = "ad2v.cli:main"

# P8 (ADR-0063/0064): the built-in plug-ins are registered like any third-party one (and also in
# an internal registry, so source checkouts work without installed metadata)
[project.entry-points."ad2v.extractors"]
python = "ad2v.extract.code.plugin:PythonPlugin"

[project.entry-points."ad2v.frameworks"]
python-frameworks = "ad2v.extract.code.plugin:PythonFrameworksPack"

[tool.setuptools]
# schema/ is the canonical location; it ships inside the wheel as the data package ad2v._schema
packages = [
    "ad2v",
    "ad2v.extract",
    "ad2v.extract.code",
    "ad2v.extract.code.rules",
    "ad2v.extract.spec",
    "ad2v.llm",
    "ad2v.llm.providers",
    "ad2v.llm.prompts",
    "ad2v._schema",
    "ad2v._schema.themes",
    "ad2v._viewer",
    "ad2v._viewer.assets",
    "ad2v.mcp",
    "ad2v.chat",
    "ad2v.testing",
    "ad2v._app",
]

[tool.setuptools.package-dir]
"" = "src"
"ad2v._schema" = "schema"
"ad2v._viewer" = "viewer/dist"  # build it first: npm ci && npm run build (in viewer/)
"ad2v._app" = "viewer/app-dist"  # the MCP App: npm run build:app (in viewer/)

[tool.setuptools.package-data]
"ad2v.extract.code.rules" = ["*.yaml"]
"ad2v.llm.prompts" = ["*.md"]
"ad2v._schema" = ["*.sql", "*.json"]
"ad2v._schema.themes" = ["*.json"]
"ad2v._viewer" = ["*.html"]
"ad2v._viewer.assets" = ["*"]
"ad2v._app" = ["app.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mcp: the MCP server (P6); run just these with pytest -m mcp",
  "slow: end-to-end CLI runs (P7 quickstart); skip with -m \"not slow\"",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fixtures", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/ad2v/preview.py" = ["E501"]  # HTML/CSS template text

[tool.ruff.lint.isort]
known-first-party = ["ad2v"]
known-local-folder = ["helpers"]
