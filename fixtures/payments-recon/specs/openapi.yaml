openapi: 3.0.3
info:
  title: payments-recon API
  version: 0.2.0
servers:
  # The path part (/v1) is prepended to every path below before pairing.
  - url: https://recon.example.com/v1
paths:
  /reconciliations:
    post:
      operationId: startReconciliation
      summary: Start a reconciliation run for a set of accounts.
      x-ad2v-refs: [REQ-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_ids:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: Run result.
  /reconciliations/{run_id}:
    get:
      operationId: getReconciliation
      summary: Fetch a reconciliation run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
        "404":
          description: Not found.
  /reconciliations/{run_id}/unmatched:
    get:
      operationId: listUnmatched
      summary: List unmatched transactions with a probable-cause label, as of a point in time.
      x-ad2v-refs: [REQ-004]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: as_of
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Unmatched transactions.
  /reconciliations/{run_id}/export:
    get:
      operationId: exportReconciliation
      summary: Export the rows of a reconciliation run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's rows.
  /reconciliations/{run_id}/audit:
    get:
      operationId: auditReconciliation
      summary: The audit trail of a reconciliation run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's audit events.
  /reconciliations/{run_id}/approve:
    post:
      operationId: approveReconciliation
      summary: Approve a completed reconciliation run.
      x-ad2v-refs: [REQ-007]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Approved.
  /health:
    get:
      operationId: health
      summary: Liveness probe.
      responses:
        "200":
          description: OK.
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string}
