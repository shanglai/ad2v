# ad2v Python classification rules. Versioned: bump rules_version on any semantic change.
# Library keys are dotted module prefixes, matched by longest prefix on whole dotted parts.
#
# Per-library keys:
#   kind                 resource kind (datastore | queue | external_service | llm_endpoint)
#   constructors         callables (relative to the library) that return a client bound to the resource
#   pure                 library-level callables that never do IO
#   pure_methods         methods on a bound client that never do IO (they return the same resource)
#   name_kwargs          kwargs whose literal/env value names the resource (e.g. base_url, model)
#   name_from_literal    accept plain string literals as names (topic names), not only URLs
#   by_service_arg       first positional literal selects the kind (boto3.client("sqs"))
#   direct_calls_touch   do library-level calls do IO? default: false for datastore, true otherwise
#   touch_functions      library-level callables that do IO even when direct_calls_touch is false
rules_version: "0.2.0"

resources:
  # --- datastores -------------------------------------------------------------------------
  sqlalchemy:
    kind: datastore
    constructors: [create_engine, create_async_engine, engine_from_config, sessionmaker,
                   async_sessionmaker, scoped_session, Session, AsyncSession, orm.Session,
                   orm.sessionmaker, ext.asyncio.create_async_engine, ext.asyncio.AsyncSession]
    pure: [text, select, insert, update, delete, Column, Integer, String, Float, Numeric, DateTime,
           Boolean, ForeignKey, Table, MetaData, func, and_, or_, not_, orm.relationship,
           orm.declarative_base, orm.DeclarativeBase, orm.Mapped, orm.mapped_column]
    pure_methods: [scalars, scalar_one, scalar_one_or_none, fetchone, fetchall, first, all, one,
                   mappings, close, begin, begin_nested, connect, __enter__, __exit__,
                   # query builders: IO is attributed to where the query is created, not refined
                   join, outerjoin, filter, filter_by, where, order_by, group_by, having, limit,
                   offset, options, select_from, distinct, subquery, with_entities, correlate,
                   union, union_all, execution_options, add_columns, params, returning, values,
                   label, alias, cte, exists]
  psycopg:
    kind: datastore
    constructors: [connect, AsyncConnection.connect, Connection.connect]
    pure_methods: [fetchone, fetchall, fetchmany, cursor, close]
  psycopg2:
    kind: datastore
    constructors: [connect, pool.SimpleConnectionPool, pool.ThreadedConnectionPool]
    pure_methods: [fetchone, fetchall, fetchmany, cursor, close]
  asyncpg:
    kind: datastore
    constructors: [connect, create_pool]
  sqlite3:
    kind: datastore
    constructors: [connect]
    pure_methods: [fetchone, fetchall, fetchmany, cursor, close]
  pymongo:
    kind: datastore
    constructors: [MongoClient]
  redis:
    kind: datastore
    constructors: [Redis, StrictRedis, from_url, asyncio.Redis, asyncio.from_url]
  google.cloud.bigquery:
    kind: datastore
    constructors: [Client]
    pure: [QueryJobConfig, ScalarQueryParameter, SchemaField]
    pure_methods: [result, to_dataframe]
  google.cloud.firestore:
    kind: datastore
    constructors: [Client, AsyncClient]
    pure_methods: [collection, document]
  google.cloud.storage:
    kind: datastore
    constructors: [Client]
    pure_methods: [bucket, blob]
  # --- queues -----------------------------------------------------------------------------
  google.cloud.pubsub:
    kind: queue
    constructors: [PublisherClient, SubscriberClient]
    pure_methods: [topic_path, subscription_path, result]
    name_from_literal: true
  google.cloud.pubsub_v1:
    kind: queue
    constructors: [PublisherClient, SubscriberClient]
    pure_methods: [topic_path, subscription_path, result]
    name_from_literal: true
  kafka:
    kind: queue
    constructors: [KafkaProducer, KafkaConsumer]
    name_from_literal: true
  confluent_kafka:
    kind: queue
    constructors: [Producer, Consumer]
    name_from_literal: true
  pika:
    kind: queue
    constructors: [BlockingConnection, ConnectionParameters, URLParameters]
    name_from_literal: true
  boto3:
    # boto3.client("sqs") -> queue; service name decides the kind.
    kind: external_service
    constructors: [client, resource, session.Session, Session]
    by_service_arg: {sqs: queue, sns: queue, kinesis: queue, s3: datastore, dynamodb: datastore,
                     bedrock-runtime: llm_endpoint}
  # --- external services ------------------------------------------------------------------
  requests:
    kind: external_service
    constructors: [Session]
    pure: [exceptions.HTTPError, exceptions.RequestException, Request]
    pure_methods: [raise_for_status, json, close]
  httpx:
    kind: external_service
    constructors: [Client, AsyncClient]
    name_kwargs: [base_url]
    pure: [HTTPError, HTTPStatusError, Timeout, Request, Response]
    pure_methods: [raise_for_status, json, aclose, close]
  aiohttp:
    kind: external_service
    constructors: [ClientSession]
    name_kwargs: [base_url]
    pure_methods: [raise_for_status, json, text, close]
  urllib.request:
    kind: external_service
  # --- LLM endpoints ----------------------------------------------------------------------
  openai:
    kind: llm_endpoint
    constructors: [OpenAI, AsyncOpenAI, AzureOpenAI, AsyncAzureOpenAI]
    name_kwargs: [model]
  anthropic:
    kind: llm_endpoint
    constructors: [Anthropic, AsyncAnthropic, AnthropicVertex, AnthropicBedrock]
    name_kwargs: [model]
  litellm:
    kind: llm_endpoint
    constructors: [Router]
    name_kwargs: [model]
  google.genai:
    kind: llm_endpoint
    constructors: [Client]
    name_kwargs: [model]
  vertexai:
    kind: llm_endpoint
    constructors: [init, generative_models.GenerativeModel]
    name_kwargs: [model_name, model]
  langchain_openai:
    kind: llm_endpoint
    constructors: [ChatOpenAI, OpenAIEmbeddings]
    name_kwargs: [model, model_name]

# Datastore access classification (reads vs writes).
access:
  read_methods: [get, fetch, fetchrow, fetchval, query, select, find, find_one, scalars, scalar,
                 list_rows, get_document, stream, hget, hgetall, mget, exists, count, download_as_bytes,
                 download_as_text]
  write_methods: [add, add_all, insert, insert_one, insert_many, insert_rows, insert_rows_json,
                  update, update_one, update_many, delete, delete_one, delete_many, merge, commit,
                  flush, set, put, save, upsert, hset, setex, incr, create, upload_from_string,
                  upload_from_filename, executemany, bulk_save_objects, load_table_from_json]
  # `execute`-like methods: classified by the SQL verb of the first string argument.
  sql_methods: [execute, exec_driver_sql, executescript, query]
  sql_write_verbs: [INSERT, UPDATE, DELETE, MERGE, UPSERT, CREATE, DROP, ALTER, TRUNCATE, REPLACE]
  sql_read_verbs: [SELECT, WITH, SHOW, EXPLAIN]
  query_builders_write: [insert, update, delete]
  query_builders_read: [select]
  queue_publish_methods: [publish, send, send_message, produce, put, basic_publish, put_record,
                          put_records, send_message_batch]
  queue_consume_methods: [subscribe, pull, receive_message, poll, consume, basic_consume, get_records]

behaviors:
  retry:
    # Decorators or callables; `bounded_by`: any of these kwargs makes the retry bounded.
    - {callable: tenacity.retry, bounded_by: [stop]}
    - {callable: tenacity.Retrying, bounded_by: [stop]}
    - {callable: tenacity.AsyncRetrying, bounded_by: [stop]}
    - {callable: backoff.on_exception, bounded_by: [max_tries, max_time]}
    - {callable: backoff.on_predicate, bounded_by: [max_tries, max_time]}
    - {callable: retrying.retry, bounded_by: [stop_max_attempt_number, stop_max_delay]}
  fan_out:
    # Calls that run their arguments concurrently. `over_collection` if an argument is starred
    # or a comprehension, or for executor map-style methods.
    callables: [asyncio.gather, asyncio.wait, asyncio.as_completed]
    executor_constructors: [concurrent.futures.ThreadPoolExecutor, concurrent.futures.ProcessPoolExecutor,
                            multiprocessing.Pool, multiprocessing.pool.ThreadPool]
    executor_map_methods: [map, imap, imap_unordered, starmap]
    executor_submit_methods: [submit, apply_async]
    task_group_constructors: [asyncio.TaskGroup, anyio.create_task_group]
  transaction:
    # `with X.<method>():` where X is bound to a datastore, or these callables.
    methods: [begin, begin_nested, transaction, atomic]
    callables: [django.db.transaction.atomic]

ports:
  http:
    app_constructors: [fastapi.FastAPI, fastapi.APIRouter, flask.Flask, flask.Blueprint,
                       starlette.routing.Router]
    method_decorators: [get, post, put, patch, delete, head, options, trace]
    route_decorators: [route, api_route, add_api_route]
    include_methods: [include_router, register_blueprint]
    prefix_kwargs: [prefix, url_prefix]
  mcp:
    server_constructors: [mcp.server.fastmcp.FastMCP, fastmcp.FastMCP, mcp.server.FastMCP]
    tool_decorators: [tool]
  cli:
    typer_constructors: [typer.Typer]
    typer_decorators: [command]
    click_decorators: [click.command, click.group]
    click_group_decorators: [command, group]
  events:
    - {constructor: google.cloud.pubsub_v1.SubscriberClient, method: subscribe, callback_kwarg: callback, callback_arg: 1, source_arg: 0}
    - {constructor: google.cloud.pubsub.SubscriberClient, method: subscribe, callback_kwarg: callback, callback_arg: 1, source_arg: 0}
  # Entry points that are not HTTP/MCP/CLI frameworks (P3, ADR-0021). They map to existing port
  # kinds with attrs.trigger: main blocks and Click -> cli_command; tasks and schedules -> event_consumer.
  entry_points:
    main_block: true                 # `if __name__ == "__main__":` -> cli_command, trigger main
    celery:
      app_constructors: [celery.Celery]
      task_decorators: [celery.shared_task, celery.task]      # @shared_task -> trigger celery_task
      app_task_methods: [task]                                # @app.task    -> trigger celery_task
      beat_schedule_names: [beat_schedule, CELERYBEAT_SCHEDULE]  # {"x": {"task": "pkg.mod.fn"}} -> celery_beat
    apscheduler:
      scheduler_constructors:
        - apscheduler.schedulers.background.BackgroundScheduler
        - apscheduler.schedulers.blocking.BlockingScheduler
        - apscheduler.schedulers.asyncio.AsyncIOScheduler
        - apscheduler.schedulers.gevent.GeventScheduler
        - apscheduler.schedulers.tornado.TornadoScheduler
        - apscheduler.AsyncScheduler
        - apscheduler.Scheduler
      add_job_methods: [add_job, add_schedule]                # sched.add_job(fn, ...)  -> apscheduler
      decorator_methods: [scheduled_job]                      # @sched.scheduled_job(...) -> apscheduler
    schedule:
      every_callables: [schedule.every]                       # schedule.every(5).minutes.do(fn) -> schedule
      do_methods: [do]

# Deterministic risk severity (format spec §3.8). Covered by rules_hash; a manifest
# `rules_overlay` may change any weight.
#   severity = (max base over the node's risk flags + nesting bonuses) * reach_factor
#   reach_factor = unreachable if no code workflow passes through the node, otherwise
#                  min(cap, reachable + per_extra_workflow * (workflows - 1))
severity:
  base:
    llm_in_loop: 5
    unbounded_retry: 4
    io_in_loop: 3
    slow_io_in_transaction: 3
    fan_out: 2
  nesting_bonus:
    nested_loop_io: 2
  reach:
    unreachable: 1.0
    reachable: 1.5
    per_extra_workflow: 0.1
    cap: 2.5

# Retrieval for the MCP tool `ad2v_locate` (P6 §7, ADR-0043). Covered by rules_hash because it
# decides which components a question points at. Deterministic: BM25 per field, weighted sum,
# then kind multipliers for the intents whose trigger words appear in the question, and a boost
# for nodes whose (normative or effective) status the question names.
retrieval:
  # tuned in P6 by coordinate descent on the 17 non-held-out questions of
  # fixtures/payments-recon/expected-questions.yaml (python -m ad2v.mcp.evaluate --tune)
  field_weights:
    name: 0.5
    qname: 0.5
    code: 1.0
    spec: 1.0
    summary: 1.0
    narration: 2.0
  status_boost: 4.0
  prefix_min: 4           # a query token of >= 4 chars also matches words that start with it
  intents:
    endpoint:
      triggers: [endpoint, endpoints, route, routes, api]
      kinds: {http_route: 1.4, spec_endpoint: 1.4}
    where:
      triggers: [where, which, located, defined, file, module]
      kinds: {module: 1.3, container: 1.3, http_route: 1.3, function: 1.2}
    risk:
      triggers: [risk, risky, loop, retry, retries, slow, fan, unbounded, dangerous]
      kinds: {loop: 1.5, retry: 1.5, fan_out: 1.5, llm_call: 1.5, transaction: 1.5}
    requirement:
      triggers: [requirement, requirements, spec, specified, drift, drifting, missing, scenario]
      kinds: {requirement: 1.5, scenario: 1.3, spec_endpoint: 1.3, spec_component: 1.2}
    flow:
      triggers: [how, start, starts, flow, happens, workflow, calls, triggered]
      kinds: {http_route: 1.3, cli_command: 1.3, event_consumer: 1.3, mcp_tool: 1.3, function: 1.1}
